[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -I /home/scorn/.platformio/packages/framework-arduinoespressif32/libraries/BLE/src
lib_deps = 
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit ILI9341@^1.5.8
    bblanchon/ArduinoJson@^6.21.3
build_src_filter = 
    +<*>
    +<../core/**>
    +<../apps/**>
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_unflags = -Os